[package]
name = "mac-cleaner"
version = "0.1.0"
description = "芒果清理 (mac-cleaner)"
authors = ["xydideo"]
license = "MIT"
edition = "2021"

[lib]
name = "mac_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
walkdir = "2"
plist = "1"
trash = "5"
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "NSView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "objc2-core-foundation"] }
